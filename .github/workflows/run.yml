name: Run

on:
  workflow_dispatch:
  schedule:
    - cron: '33 0 * * *'   # UTC 00:33 = 北京时间 08:33

permissions:
  contents: read

concurrency:
  group: run-group
  cancel-in-progress: false

env:
  CHATGPT2API_REPO: frjzyb31183k/chatgpt2api
  RUN_DURATION: 19800

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout chatgpt2api
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHATGPT2API_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: chatgpt2api
          fetch-depth: 1

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.13"
          enable-cache: "false"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: chatgpt2api
        run: |
          set -Eeuo pipefail
          uv sync
          uv pip install --python .venv/bin/python python-dotenv
          npm install --prefix web
          NEXT_PUBLIC_APP_VERSION="$(cat VERSION)" npm run build --prefix web
          mv web/out web_dist

      - name: Install and start WARP SOCKS5
        run: |
          set -Eeuo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc
          sleep 3
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for _ in $(seq 1 30); do
            ss -ltn | grep -q ':40000' && break
            sleep 1
          done
          ss -ltn | grep -q ':40000' || { echo "WARP SOCKS5 port 40000 not listening"; warp-cli --accept-tos status || true; exit 1; }
          code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out "%{http_code}" --socks5-hostname 127.0.0.1:40000 https://accounts.x.ai/)
          [ "$code" != "000" ] || { echo "WARP SOCKS5 transport failed"; exit 1; }
          echo "WARP SOCKS5 ready: 127.0.0.1:40000 (HTTP $code)"

      - name: Start chatgpt2api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_BACKEND: session_network
          CHATGPT2API_AUTH_KEY: ${{ secrets.CHATGPT2API_AUTH_KEY }}
          CHATGPT2API_PROXY_RUNTIME_ENABLED: "true"
          CHATGPT2API_PROXY_RUNTIME_EGRESS_MODE: single_proxy
          CHATGPT2API_PROXY_RUNTIME_PROXY_URL: socks5h://127.0.0.1:40000
          CHATGPT2API_PROXY_RUNTIME_FORCE: "true"
          CHATGPT2API_PROXY_RUNTIME_CLEARANCE_ENABLED: "false"
          CHATGPT2API_AUTO_REMOVE_INVALID_ACCOUNTS: "false"
        run: |
          set -Eeuo pipefail
          (
            cd chatgpt2api
            CHATGPT2API_CONFIG_FILE="$PWD/config.json" uv run python scripts/init_proxy_config.py
            # Tunnel 远端仍指向 8080；无 nginx 时服务直接听 8080
            # 单 worker：进度/outbox/号池均为进程内状态，多 worker 会互相覆盖
            nohup uv run uvicorn main:app --host 127.0.0.1 --port 8080 --workers 1 > ../chatgpt2api.log 2>&1 &
            echo $! > /tmp/chatgpt2api.pid
          )
          # curl 失败放在函数/|| 里，避免 set -e 直接杀脚本
          ready() {
            local port="$1" pid_file="$2"
            for _ in $(seq 1 90); do
              ss -ltn | grep -q ":8080 " && return 0
              kill -0 "$(cat "$pid_file")" 2>/dev/null || return 1
              sleep 2
            done
            return 1
          }
          ready 8080 /tmp/chatgpt2api.pid \
            || { echo "chatgpt2api failed to become ready"; tail -100 chatgpt2api.log; exit 1; }
          echo "chatgpt2api ready on :8080"

      # Cloudflare Tunnel origin 需为 http://127.0.0.1:8080
      - name: Start Cloudflare Tunnel
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set -Eeuo pipefail
          [ -n "$CF_TUNNEL_TOKEN" ] || { echo "CF_TUNNEL_TOKEN secret is not set"; exit 1; }
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate run --token "$CF_TUNNEL_TOKEN" > tunnel.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          sleep 10
          kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null || { echo "Cloudflare Tunnel exited"; exit 1; }

      - name: Keep services alive
        run: |
          set -u
          end=$((SECONDS + RUN_DURATION))
          # no HTTP probe: account-watcher blocks workers during startup
          # only check pid alive + port 8080 bound
          echo "keepalive: pid+port only (no HTTP probe)"
          while [ "$SECONDS" -lt "$end" ]; do
            kill -0 "$(cat /tmp/chatgpt2api.pid)" 2>/dev/null || { echo "chatgpt2api exited"; tail -50 chatgpt2api.log || true; exit 1; }
            ss -ltn | grep -q ":8080 " || { echo "chatgpt2api port 8080 not listening"; tail -50 chatgpt2api.log || true; exit 1; }
            kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null || { echo "Cloudflare Tunnel exited"; tail -50 tunnel.log || true; exit 1; }
            sleep 30
          done

      - name: Print redacted diagnostics
        if: always()
        run: |
          for log in chatgpt2api.log tunnel.log; do
            [ -f "$log" ] || continue
            echo "=== $log ==="
            tail -100 "$log" | sed -E \
              -e 's#(https?|postgres(ql)?)://[^[:space:]]+#<url>#g' \
              -e 's#(token|authorization|cookie|password|accessToken)[=: ]+[^[:space:]]+#\1=***#Ig' \
              -e 's#eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+#<jwt>#g' || true
          done
