name: WinRunner Relay

on:
  workflow_run:
    workflows: ["Run"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: relay-group
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Time gate (Beijing 10:00-22:00 only)
        run: |
          hour=$(TZ='Asia/Shanghai' date +%H)
          if [ "$hour" -lt 10 ] || [ "$hour" -ge 22 ]; then
            echo "Outside Beijing 10:00-22:00 (now ${hour}:00), skipping relay"
            exit 0
          fi
          echo "Within Beijing window (now ${hour}:00), continuing relay"

      - name: Wait before next run
        run: sleep 30

      - name: Trigger next run
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches"
          echo "Next run triggered"
